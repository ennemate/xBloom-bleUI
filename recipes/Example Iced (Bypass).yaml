name: Example Iced (Bypass)
dose: 18
grind_size: 50
grind_enabled: true
grind_rpm: 80
interval_sync: true
bypass_enabled: true
bypass_volume: 60.0
bypass_temp: 85.0
steps:
- temp: 94
  pour: 40
  wait: 30
  flow_rate: 3.0
  pattern: spiral
  agitation_before: true
  agitation_after: false
- temp: 92
  pour: 80
  wait: 5
  flow_rate: 3.2
  pattern: spiral
  agitation_before: false
  agitation_after: false
